[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2021"

description = "A PocketBook e-reader application built on inkview-rs"
license = "MIT"
keywords = ["inkview", "pocketbook", "eink"]

[dependencies]
inkview = { version = "0.3.0", default-features = false}
{% if framework == "slint" %}
inkview-slint = { version = "0.3.0", default-features = false}
slint = { version = "1.14.1", default-features = false, features = ["compat-1-2", "std", "software-renderer-systemfonts", "renderer-software"] }
euclid = "0.22.11"
rgb = "0.8.52"
{% elsif framework == "embedded-graphics" %}
inkview-eg = { version = "0.3.0", default-features = false}
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
anyhow = "1.0"
{% endif %}

{% if framework == "slint" %}
[build-dependencies]
slint-build = { version = "1.14.1" }
{% endif %}

[features]
# Exactly one sdk-* feature must be enabled; they select mutually exclusive FFI
# bindings. `just build` passes --no-default-features so that overriding
# pb_sdk_version replaces this default rather than stacking on top of it.
default = ["sdk-6-10"]
{% if framework == "slint" %}
sdk-5-19 = ["inkview/sdk-5-19", "inkview-slint/sdk-5-19"]
sdk-6-5 = ["inkview/sdk-6-5", "inkview-slint/sdk-6-5"]
sdk-6-8 = ["inkview/sdk-6-8", "inkview-slint/sdk-6-8"]
sdk-6-10 = ["inkview/sdk-6-10", "inkview-slint/sdk-6-10"]
{% elsif framework == "embedded-graphics" %}
sdk-5-19 = ["inkview/sdk-5-19", "inkview-eg/sdk-5-19"]
sdk-6-5 = ["inkview/sdk-6-5", "inkview-eg/sdk-6-5"]
sdk-6-8 = ["inkview/sdk-6-8", "inkview-eg/sdk-6-8"]
sdk-6-10 = ["inkview/sdk-6-10", "inkview-eg/sdk-6-10"]
{% else %}
sdk-5-19 = ["inkview/sdk-5-19"]
sdk-6-5 = ["inkview/sdk-6-5"]
sdk-6-8 = ["inkview/sdk-6-8"]
sdk-6-10 = ["inkview/sdk-6-10"]
{% endif %}

[profile.release]
opt-level = "s"
lto = true
strip = true

# The desktop emulator (`just run-emu`) hands back a NULL task framebuffer, which
# makes inkview 0.3.0's Screen::new panic with "Failed to get current task
# framebuffer while creating new screen." simmsb/inkview-rs#24 falls back to
# GetCanvas() there, but is not in a published release yet, so resolve inkview
# from a branch carrying that fix. Without this the slint and embedded-graphics
# variants cannot start under the emulator; on device, either version works.
#
# TODO: delete this section once an inkview release with the fix is on crates.io,
# and let the version requirement above resolve normally.
[patch.crates-io]
inkview = { git = "https://github.com/ihrfv/inkview-rs", branch = "emulator" }
